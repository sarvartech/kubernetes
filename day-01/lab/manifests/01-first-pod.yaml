apiVersion: v1
kind: Pod
metadata:
  name: my-first-pod
  labels:
    app: my-web-app
    tier: frontend
spec:
  containers:
  - name: nginx-container
    image: nginx:alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "250m"
